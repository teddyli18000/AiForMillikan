name: Normal Release

on:
  push:
    tags:
      - "normal-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: normal/pyproject.toml

      - name: Install Python dependencies
        working-directory: normal
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -e ".[dev]"

      - name: Python tests
        working-directory: normal
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: .venv\Scripts\python -m pytest tests -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: normal/apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: normal/apps/desktop
        run: npm ci

      - name: Frontend tests
        working-directory: normal/apps/desktop
        run: npm test

      - name: Build renderer and Electron main
        working-directory: normal/apps/desktop
        run: npm run build

      - name: Build Python worker
        working-directory: normal/apps/desktop
        env:
          MILLIKAN_PYTHON: ${{ github.workspace }}\normal\.venv\Scripts\python.exe
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: npm run worker:build

      - name: Packaged worker end-to-end
        working-directory: normal
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: .venv\Scripts\python scripts\probe_packaged_worker.py --worker apps\desktop\dist-worker\millikan-normal-worker.exe

      - name: Package portable EXE
        working-directory: normal/apps/desktop
        run: npx electron-builder --win portable --publish never

      - name: Prepare packaged app directory
        working-directory: normal/apps/desktop
        run: npx electron-builder --win dir --publish never

      - name: Electron IPC smoke
        working-directory: normal/apps/desktop
        env:
          MILLIKAN_SMOKE_VIDEO: ${{ github.workspace }}\media\videos\2u.mp4
        run: node tests/electron-smoke.mjs

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem normal/apps/desktop/release/*.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding utf8 -FilePath "$($exe.FullName).sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 密立根油滴实验 ${{ github.ref_name }}
          body_path: normal/RELEASE_NOTES.md
          make_latest: true
          files: |
            normal/apps/desktop/release/*.exe
            normal/apps/desktop/release/*.sha256
