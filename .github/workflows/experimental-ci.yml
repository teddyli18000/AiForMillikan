name: Experimental CI

on:
  push:
    paths:
      - "experimental/**"
      - "media/**"
      - ".github/workflows/experimental-ci.yml"
  pull_request:
    paths:
      - "experimental/**"
      - "media/**"
      - ".github/workflows/experimental-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experimental/pyproject.toml

      - name: Install Python dependencies
        working-directory: experimental
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -e ".[dev]"

      - name: Python tests
        working-directory: experimental
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: .venv\Scripts\python -m pytest tests -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: experimental/apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: experimental/apps/desktop
        run: npm ci

      - name: Frontend tests
        working-directory: experimental/apps/desktop
        run: npm test

      - name: Build renderer and Electron main
        working-directory: experimental/apps/desktop
        run: npm run build

      - name: Build Python worker
        working-directory: experimental/apps/desktop
        env:
          MILLIKAN_PYTHON: ${{ github.workspace }}\experimental\.venv\Scripts\python.exe
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: npm run worker:build

      - name: Verify packaged worker reads bundled config
        working-directory: experimental
        shell: pwsh
        run: .\scripts\probe_packaged_worker.ps1

      - name: Package portable EXE
        working-directory: experimental/apps/desktop
        run: npx electron-builder --win portable --publish never

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: millikan-ai-experimental-portable
          path: experimental/apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
