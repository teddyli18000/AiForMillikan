name: Finalize Millikan AI 1.0 release assets (one-time)
on:
  push:
    paths:
      - ".github/workflows/publish-millikan-1-0-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated portable EXE
        uses: actions/download-artifact@v4
        with:
          name: millikan-ai-normal-portable
          run-id: 43613005642
          github-token: ${{ github.token }}
          path: release
      - name: Publish clearly named files and remove shortened duplicates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f 'release/密立根油滴实验-1.0.0.exe'
          mv 'release/密立根油滴实验-1.0.0.exe' 'release/Millikan-AI-1.0.0-Windows.exe'
          (cd release && sha256sum 'Millikan-AI-1.0.0-Windows.exe' > 'Millikan-AI-1.0.0-Windows.exe.sha256')
          gh release upload normal-v1.0.0 release/Millikan-AI-1.0.0-Windows.exe release/Millikan-AI-1.0.0-Windows.exe.sha256 --repo "$GITHUB_REPOSITORY"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/748218408"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/748218406"
