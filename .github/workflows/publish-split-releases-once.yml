name: Publish split-app releases (one-time)
on:
  push:
    paths:
      - ".github/workflows/publish-split-releases-once.yml"
permissions:
  actions: read
  contents: write
jobs:
  normal:
    runs-on: windows-latest
    steps:
      - name: Retrieve CI-validated Normal EXE
        uses: actions/download-artifact@v4
        with:
          name: millikan-ai-normal-portable
          run-id: 42795634746
          github-token: ${{ github.token }}
          path: release/normal
      - name: Create SHA256
        shell: pwsh
        run: |
          $exe = Get-ChildItem "release/normal/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Normal EXE missing" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding utf8 "$($exe.FullName).sha256"
      - name: Publish Normal release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: normal-v0.9.0
          target_commitish: 992da3ad74e3b9a6438844012cbed1cec49fc7cf
          name: Millikan AI Normal v0.9.0
          make_latest: "true"
          fail_on_unmatched_files: true
          body: |
            First standalone Normal release after the monorepo split (Issue #4, PR #5).
            Human-in-the-loop single-droplet measurements, crossing review,
            charge calculation, blind inversion and export.
            Windows portable executable; CI-validated packaged worker and real Electron IPC.
          files: |
            release/normal/*.exe
            release/normal/*.sha256
  experimental:
    runs-on: windows-latest
    steps:
      - name: Retrieve CI-validated Experimental EXE
        uses: actions/download-artifact@v4
        with:
          name: millikan-ai-experimental-portable
          run-id: 42795634528
          github-token: ${{ github.token }}
          path: release/experimental
      - name: Create SHA256
        shell: pwsh
        run: |
          $exe = Get-ChildItem "release/experimental/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Experimental EXE missing" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding utf8 "$($exe.FullName).sha256"
      - name: Publish Experimental release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: experimental-v0.1.0
          target_commitish: 992da3ad74e3b9a6438844012cbed1cec49fc7cf
          name: Millikan AI Experimental v0.1.0
          make_latest: "false"
          fail_on_unmatched_files: true
          body: |
            First standalone Experimental release after the monorepo split (Issue #4, PR #5).
            Multi-droplet and multi-platform video analysis with research diagnostics.
            Windows portable executable; CI-validated packaged worker and real Electron IPC.
          files: |
            release/experimental/*.exe
            release/experimental/*.sha256
