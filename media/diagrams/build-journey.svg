<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Millikan AI build journey</title>
  <desc id="desc">A release timeline showing the engineering problems resolved from version 0.1.1 to 1.0.</desc>
  <rect width="1400" height="650" fill="#f7f6f2"/>
  <rect x="44" y="44" width="1312" height="562" rx="18" fill="#fffefa" stroke="#d8d5cc"/>
  <text x="88" y="112" fill="#1f1f1d" font-family="Arial, sans-serif" font-size="30" font-weight="700">Built through real-video failures</text>
  <text x="88" y="150" fill="#696760" font-family="Arial, sans-serif" font-size="18">The interface improved when the underlying contracts became explicit.</text>
  <line x1="126" y1="302" x2="1274" y2="302" stroke="#bbb6ad" stroke-width="3"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(126 302)">
      <circle r="12" fill="#d2634f"/>
      <text x="0" y="-48" text-anchor="middle" fill="#d2634f" font-size="18" font-weight="700">0.1.1</text>
      <text x="0" y="58" text-anchor="middle" fill="#22211f" font-size="17" font-weight="700">Coordinate mapping</text>
      <text x="0" y="84" text-anchor="middle" fill="#77736b" font-size="14">letterbox-aware selection</text>
    </g>
    <g transform="translate(318 302)">
      <circle r="12" fill="#d2634f"/>
      <text x="0" y="-48" text-anchor="middle" fill="#d2634f" font-size="18" font-weight="700">0.1.3</text>
      <text x="0" y="58" text-anchor="middle" fill="#22211f" font-size="17" font-weight="700">State ownership</text>
      <text x="0" y="84" text-anchor="middle" fill="#77736b" font-size="14">video state != record status</text>
    </g>
    <g transform="translate(510 302)">
      <circle r="12" fill="#d2634f"/>
      <text x="0" y="-48" text-anchor="middle" fill="#d2634f" font-size="18" font-weight="700">0.1.4</text>
      <text x="0" y="58" text-anchor="middle" fill="#22211f" font-size="17" font-weight="700">Scientific repair</text>
      <text x="0" y="84" text-anchor="middle" fill="#77736b" font-size="14">tracking parity + sigma_q</text>
    </g>
    <g transform="translate(702 302)">
      <circle r="12" fill="#2f6f9f"/>
      <text x="0" y="-48" text-anchor="middle" fill="#2f6f9f" font-size="18" font-weight="700">0.1.5</text>
      <text x="0" y="58" text-anchor="middle" fill="#22211f" font-size="17" font-weight="700">Review playback</text>
      <text x="0" y="84" text-anchor="middle" fill="#77736b" font-size="14">backend frame sequences</text>
    </g>
    <g transform="translate(894 302)">
      <circle r="12" fill="#2f6f9f"/>
      <text x="0" y="-48" text-anchor="middle" fill="#2f6f9f" font-size="18" font-weight="700">0.1.6</text>
      <text x="0" y="58" text-anchor="middle" fill="#22211f" font-size="17" font-weight="700">Repeated measures</text>
      <text x="0" y="84" text-anchor="middle" fill="#77736b" font-size="14">authoritative next-drop reset</text>
    </g>
    <g transform="translate(1086 302)">
      <circle r="12" fill="#177a55"/>
      <text x="0" y="-48" text-anchor="middle" fill="#177a55" font-size="18" font-weight="700">0.1.8</text>
      <text x="0" y="58" text-anchor="middle" fill="#22211f" font-size="17" font-weight="700">Readable results</text>
      <text x="0" y="84" text-anchor="middle" fill="#77736b" font-size="14">formula trace + diagnostics</text>
    </g>
    <g transform="translate(1274 302)">
      <circle r="18" fill="#177a55"/>
      <text x="0" y="-54" text-anchor="middle" fill="#177a55" font-size="21" font-weight="700">1.0</text>
      <text x="0" y="58" text-anchor="middle" fill="#22211f" font-size="17" font-weight="700">Release contract</text>
      <text x="0" y="84" text-anchor="middle" fill="#77736b" font-size="14">UTF-8 + docs + package</text>
    </g>
  </g>
  <g transform="translate(88 456)" font-family="Arial, sans-serif">
    <rect width="1224" height="94" rx="10" fill="#f1eee7"/>
    <text x="28" y="38" fill="#22211f" font-size="17" font-weight="700">One recurring rule</text>
    <text x="28" y="68" fill="#696760" font-size="16">A UI fix is complete only when frontend state, worker contract, backend authority, artifacts, and tests agree.</text>
  </g>
</svg>
