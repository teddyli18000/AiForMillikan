<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Millikan AI measurement workflow</title>
  <desc id="desc">A five-stage path from experimental video to an elementary charge estimate.</desc>
  <rect width="1400" height="560" fill="#f7f6f2"/>
  <rect x="44" y="44" width="1312" height="472" rx="18" fill="#fffefa" stroke="#d8d5cc"/>
  <text x="88" y="112" fill="#1f1f1d" font-family="Arial, sans-serif" font-size="30" font-weight="700">From evidence to elementary charge</text>
  <text x="88" y="150" fill="#696760" font-family="Arial, sans-serif" font-size="18">Each transition keeps a reviewable artifact.</text>
  <line x1="196" y1="282" x2="1204" y2="282" stroke="#d8d5cc" stroke-width="3"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(106 202)">
      <circle cx="90" cy="80" r="66" fill="#fffefa" stroke="#d2634f" stroke-width="3"/>
      <rect x="57" y="49" width="66" height="48" rx="5" fill="none" stroke="#d2634f" stroke-width="4"/>
      <circle cx="90" cy="73" r="10" fill="#d2634f"/>
      <text x="90" y="174" text-anchor="middle" fill="#22211f" font-size="22" font-weight="700">Video</text>
      <text x="90" y="204" text-anchor="middle" fill="#77736b" font-size="15">metadata + 0 V interval</text>
    </g>
    <g transform="translate(360 202)">
      <circle cx="90" cy="80" r="66" fill="#fffefa" stroke="#d2634f" stroke-width="3"/>
      <polyline points="53,104 64,91 71,96 81,67 93,76 104,52 117,62 126,40" fill="none" stroke="#d2634f" stroke-width="5"/>
      <circle cx="126" cy="40" r="7" fill="#d2634f"/>
      <text x="90" y="174" text-anchor="middle" fill="#22211f" font-size="22" font-weight="700">Trajectory</text>
      <text x="90" y="204" text-anchor="middle" fill="#77736b" font-size="15">target + missing + review</text>
    </g>
    <g transform="translate(614 202)">
      <circle cx="90" cy="80" r="66" fill="#fffefa" stroke="#2f6f9f" stroke-width="3"/>
      <line x1="50" y1="112" x2="128" y2="43" stroke="#2f6f9f" stroke-width="5"/>
      <circle cx="57" cy="105" r="6" fill="#2f6f9f"/>
      <circle cx="88" cy="78" r="6" fill="#2f6f9f"/>
      <circle cx="120" cy="50" r="6" fill="#2f6f9f"/>
      <text x="90" y="174" text-anchor="middle" fill="#22211f" font-size="22" font-weight="700">Velocity</text>
      <text x="90" y="204" text-anchor="middle" fill="#77736b" font-size="15">linear fit + sigma_v</text>
    </g>
    <g transform="translate(868 202)">
      <circle cx="90" cy="80" r="66" fill="#fffefa" stroke="#2f6f9f" stroke-width="3"/>
      <text x="90" y="95" text-anchor="middle" fill="#2f6f9f" font-family="Georgia, serif" font-size="58" font-style="italic">q</text>
      <text x="90" y="174" text-anchor="middle" fill="#22211f" font-size="22" font-weight="700">Drop charge</text>
      <text x="90" y="204" text-anchor="middle" fill="#77736b" font-size="15">radius + balance voltage</text>
    </g>
    <g transform="translate(1122 202)">
      <circle cx="90" cy="80" r="66" fill="#fffefa" stroke="#177a55" stroke-width="3"/>
      <text x="90" y="95" text-anchor="middle" fill="#177a55" font-family="Georgia, serif" font-size="58" font-style="italic">e</text>
      <text x="90" y="174" text-anchor="middle" fill="#22211f" font-size="22" font-weight="700">Blind inversion</text>
      <text x="90" y="204" text-anchor="middle" fill="#77736b" font-size="15">integer residual search</text>
    </g>
    <g fill="#a6a198">
      <path d="M310 274 l18 8 -18 8 z"/>
      <path d="M564 274 l18 8 -18 8 z"/>
      <path d="M818 274 l18 8 -18 8 z"/>
      <path d="M1072 274 l18 8 -18 8 z"/>
    </g>
  </g>
  <rect x="88" y="454" width="1224" height="1" fill="#e5e1d9"/>
  <text x="88" y="486" fill="#696760" font-family="Arial, sans-serif" font-size="16">Human checkpoints: boundary confirmation | rectangle selection | crossing identity | record acceptance</text>
</svg>
