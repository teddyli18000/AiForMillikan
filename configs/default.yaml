project:
  name: millikan_ai
  run_root: runs

analysis_mode: quick

video:
  sample_frames: 8
  diagnostics_dir: diagnostics

roi:
  microscope_roi: null
  voltage_roi: null
  screen_corners: null

calibration:
  measurement_distance_m: 0.0015
  min_grid_lines: 4

segment:
  boundary_guard_frames: 0
  velocity_bootstrap_samples_quick: 200
  stable_min_duration_s: 2.0
  min_valid_points: 45
  max_missing_ratio: 0.15
  min_fit_r2: 0.90
  min_motion_displacement_px: 8

auto_platform_detection:
  enabled: true
  sample_stride_frames: 5
  search_region: [0.45, 0.0, 0.55, 0.32]
  min_platform_duration_s: 2.0
  transition_padding_s: 0.2
  min_change_score: 0.08
  change_threshold_sigma: 3.0
  min_change_separation_s: 1.0
  roi_expand_px: 10
  max_voltage_text_width_px: 380
  dynamic_roi_per_sample: true
  max_dynamic_roi_shift_px: 120
  descriptor_width: 96
  descriptor_height: 32

tracking:
  top_k_seeds: 30
  seed_sample_frames: 6
  seed_merge_distance_px: 18
  seed_min_grid_line_distance_px: 0
  max_drops: 20
  multi_drop_min_trajectory_distance_px: 20
  max_search_radius_px: 35
  max_missing_frames: 15
  min_blob_area_px: 3
  max_blob_area_px: 180
  detection_nms_distance_px: 6
  kalman_process_noise: 1.0
  kalman_measurement_noise: 2.0
  mahalanobis_gate: 6.0
  max_area_ratio: 3.0
  lk_window_size_px: 21
  lk_pyramid_levels: 3
  lk_max_forward_backward_error_px: 1.5
  lk_max_photometric_error: 30
  lk_detection_gate_px: 12
  lk_prediction_gate_px: 12
  lk_measurement_weight: 0.25
  best_track_min_score: 0.45
  restrict_to_measurement_grid: true
  min_grid_line_distance_px: 8
  min_grid_clear_fraction: 0.60
  min_tracking_roi_margin_px: 20
  min_roi_clear_fraction: 0.70

physics:
  plate_distance_m: 0.005
  oil_density_kg_m3: 981.0
  pressure_Pa: 101325.0
  cunningham_b_Pa_m: 0.0000082
  gravity_m_s2: 9.80665
  random_mc_samples: 1000
  systematic_mc_samples: 0
  systematic_uncertainty:
    spatial_scale_rel: 0.0
    plate_distance_rel: 0.0
    voltage_scale_rel: 0.0
    temperature_C: 0.0
    pressure_rel: 0.0
    oil_density_rel: 0.0
    cunningham_b_rel: 0.0

viscosity:
  source: temperature
  air_temperature_C: 20.0
  direct_air_viscosity_Pa_s: null
  reference_temperature_K: 293.15
  reference_viscosity_Pa_s: 1.81e-5
  sutherland_constant_K: 110.4

elementary:
  min_drops_for_estimation: 3
  profile_grid_points: 800
  comparison_profile_grid_points: 120
  tau_lambda_profile_optimize_points: 16
  tau_lambda_optimizer_maxiter: 80
  profile_mode_optimize_relative_threshold: 0.02
  max_profile_modes_to_optimize: 96
  candidate_mode_min_relative_likelihood: 1.0e-4
  mode_relative_likelihood_threshold: 0.02
  harmonic_ratio_tolerance: 0.04
  harmonic_integer_max: 4
  e_bootstrap_samples: 1000
  measurement_mc_samples: 1000
  null_simulation_samples: 300
  enable_calibrated_evidence_labels: false
  systematic_e_profile_grid_points: 80
  systematic_tau_lambda_profile_optimize_points: 2
  systematic_tau_lambda_optimizer_maxiter: 20
  random_seed: 42

quality:
  mode: mock_rule_adapter
  model_version: rules-v1
  quality_threshold: 0.60
  thresholds:
    max_missing_ratio: 0.40
    min_duration_s: 1.0
    target_duration_s: 3.0
    min_platforms: 2
    min_speed_fit_r2: 0.75
    max_frame_jump_px: 12
    max_area_cv: 0.45
  trajectory_weights:
    tracking: 0.20
    continuity: 0.15
    duration: 0.10
    platforms: 0.20
    fit: 0.20
    drift: 0.05
    grid_clear: 0.05
    roi_clear: 0.05
  stage_weights:
    trajectory: 0.55
    physics: 0.45

output:
  voltage_samples_csv: voltage_samples.csv
  auto_platform_suggestions_csv: auto_platform_suggestions.csv
  platforms_csv: platforms.csv
  best_track_csv: best_track.csv
  drop_tracks_csv: drop_tracks.csv
  best_track_segments_csv: best_track_segments.csv
  drop_track_segments_csv: drop_track_segments.csv
  candidate_tracks_summary_csv: candidate_tracks_summary.csv
  trajectory_quality_scores_csv: trajectory_quality_scores.csv
  diagnostics_json: diagnostics.json
  drop_results_json: drop_results.json
  multi_drop_results_json: multi_drop_results.json
  platform_velocity_results_csv: platform_velocity_results.csv
  drop_charge_results_csv: drop_charge_results.csv
  drop_charge_failures_json: drop_charge_failures.json
  model_comparison_json: model_comparison.json
  uncertainty_details_json: uncertainty_details.json
  quality_scores_json: quality_scores.json
  elementary_charge_result_json: elementary_charge_result.json
  validity_report_json: validity_report.json
  visualization_layers_json: visualization_layers.json
  diagnostic_overlay_jpg: diagnostic_overlay.jpg
  overlay_mp4: overlay_best_track.mp4
  run_manifest_json: run_manifest.json
  summary_txt: summary.txt
  analysis_report_md: analysis_report.md
