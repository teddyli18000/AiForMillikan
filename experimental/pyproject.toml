[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "millikan-ai-experimental"
version = "0.1.0"
description = "Experimental multi-drop / multi-platform Millikan analysis backend and CLI"
requires-python = ">=3.11"
dependencies = [
  "opencv-python",
  "numpy",
  "scipy",
  "pandas",
  "pyyaml",
  "trackpy",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pyinstaller",
]

[project.scripts]
millikan-ai-experimental = "millikan_ai.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
